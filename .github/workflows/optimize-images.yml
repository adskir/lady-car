name: Ottimizza immagini

on:
  push:
    branches: [main]
    paths: ["img/**"]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Ottimizza le immagini cambiate in questo push
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files img)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- img)
          fi
          [ -n "$FILES" ] && python scripts/optimize_images.py $FILES || echo "Nessuna immagine da ottimizzare"
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add img
            git commit -m "Immagini ottimizzate automaticamente [skip ci]"
            git push
          fi
