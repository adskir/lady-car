name: Compila CSS (Tailwind)

on:
  push:
    branches: [main]
    paths: ["index.html", "privacy.html", "src/**", "tailwind.config.js"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx -y tailwindcss@3 -c tailwind.config.js -i src/tailwind.css -o css/site.css --minify
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain css)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add css/site.css
            git commit -m "CSS ricompilato automaticamente [skip ci]"
            git push
          fi
